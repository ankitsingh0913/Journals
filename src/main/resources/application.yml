spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  mvc:
    favicon:
      enabled: false
  redis:
    host: ${Redis_Host}
    port: ${Redis_Port}
  application:
    name: JournalDB
  data:
    mongodb:
      uri: ${DataBase_URI}
      database: journalDB
      auto-index-creation: true
  main:
    allow-circular-references: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

weather:
  api:
    key: ${WEATHER_API}

